<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<body><header class="site-header"><div class="nav"><a class="brand" href="/">關廟天后宮<small>GUANMIAO TIANHOU TEMPLE</small></a><a class="directory-link" href="/#functions">功能選單</a></div></header>
<main><div class="page-heading"><a class="return-home" href="/">← 返回首頁</a><h1>點燈互動小遊戲</h1></div>
<div class="content-panel"><p><a class="text-link" href="/lights/">← 返回祈福點燈</a></p>
<form id="quiz" class="editorial-form"><fieldset><legend>1. 你想為誰點燈？</legend><select name="person" required><option value="">請選擇</option><option>自己</option><option>家人</option><option>孩子</option><option>全家人</option><option>其他親友</option></select></fieldset>
<fieldset><legend>2. 想參考哪個生肖？</legend><select name="zodiac" required><option value="">請選擇</option><option>鼠</option><option>牛</option><option>虎</option><option>兔</option><option>龍</option><option>蛇</option><option>馬</option><option>羊</option><option>猴</option><option>雞</option><option>狗</option><option>豬</option><option>不確定／全家人有不同生肖</option></select></fieldset>
<fieldset><legend>3. 你想祈求什麼？（可複選）</legend><label class="check"><input type="checkbox" name="goal" value="peace"> 平安順遂</label><label class="check"><input type="checkbox" name="goal" value="study"> 學業或考試</label><label class="check"><input type="checkbox" name="goal" value="work"> 工作或事業</label><label class="check"><input type="checkbox" name="goal" value="love"> 想找另一半</label><label class="check"><input type="checkbox" name="goal" value="family"> 家人健康</label></fieldset>
<fieldset><legend>4. 想參考哪類燈種？</legend><select name="style"><option value="all">按祈願方向推薦</option><option value="basic">一般祈福燈</option><option value="small">小斗燈</option><option value="large">大斗燈</option></select></fieldset>
<fieldset><legend>5. 還想參考哪些心願？（可複選）</legend><label class="check"><input type="checkbox" name="goal" value="travel"> 出入平安</label><label class="check"><input type="checkbox" name="goal" value="fortune"> 財運順遂</label><label class="check"><input type="checkbox" name="goal" value="child"> 求子祈願</label><label class="check"><input type="checkbox" name="goal" value="all"> 全部都參考</label></fieldset><div><button class="button">查看推薦燈種</button><button type="reset" class="button outline">重新選擇</button></div></form>
<section id="result" tabindex="-1" hidden><h2>推薦燈種</h2><p id="result-note"></p><div id="lamps" class="lamp-cards"></div><p>點燈期間為 2027 年 2 月 20 日至 2028 年 1 月 12 日。名額及受理辦法以廟方公告為準。</p></section>
<details class="lamp-gallery">
  <summary>查看全部燈種圖卡</summary>
  <div id="lamp-gallery" class="lamp-cards"></div>
</details><section class="registration-panel" data-light-registration aria-label="線上點燈登記"><h2>線上點燈登記</h2><p data-registration-status role="status">線上點燈將於2026年11月30日凌晨0時（台灣時間）開放登記。</p><a class="button" data-registration-link hidden>前往線上點燈登記</a><noscript><p>請啟用瀏覽器的 JavaScript，以顯示登記入口。</p></noscript></section></div>
<div class="page-end"><a class="return-home" href="/">← 返回首頁</a></div></main><footer>關廟天后宮｜天三聖母</footer></body></html>
